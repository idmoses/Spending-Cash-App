<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly - Sign Up</title>
  <link rel="stylesheet" href="spendlylogin.css">
  <!-- ADDED PER GUIDE -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- GOOGLE CONFIG - GUIDE SECTION 4 & 10 -->
  <div id="g_id_onload"
       data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"
       data-context="signup"
       data-callback="handleGoogleResponse"
       data-auto_prompt="false">
  </div>

  <div class="bg-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
  </div>

  <div class="login-container fade-in">
    <div class="login-left">
      <h1>💸 Spendly</h1>
      <h2>Start Your Journey</h2>
      <p>Join thousands managing their money smarter. Free forever.</p>
      <img src="https://img.freepik.com/free-vector/mobile-payments-concept-illustration_114360-1665.jpg" alt="Finance">
    </div>

    <div class="login-right">
      <div class="login-box slide-up">
        <h2>Create Account ✨</h2>
        <p class="subtitle">It's free and takes 30 seconds</p>

        <button class="btn-google" onclick="googleLogin()">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C1.14 11.49 0 17.88 0 24s1.14 12.51 3.55 14.78l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Sign up with Google
        </button>

        <div class="divider"><span>or</span></div>

        <form id="signupForm">
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="John Doe" required>
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@email.com" required>
          </div>
          <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Min 6 characters" required>
              <span class="eye-icon" id="togglePassword">👁️</span>
            </div>
          </div>

          <button type="submit" class="btn-login">Create Account →</button>
          <p class="signup">Already have an account? <a href="spendlylogin.html">Login</a></p>
        </form>
      </div>
    </div>
  </div>
  <script src="spendlylogin.js"></script>

  <!-- GOOGLE LOGIC - SAME AS LOGIN, WORKS FOR SIGNUP TOO PER GUIDE SEC 12 -->
  <script>
    function googleLogin() {
      if (typeof google === 'undefined' || !google.accounts) {
        showToastLocal("Google not loaded yet, try again", "error");
        return;
      }
      google.accounts.id.initialize({
        client_id: "YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com",
        callback: handleGoogleResponse
      });
      google.accounts.id.prompt();
    }

    async function handleGoogleResponse(response) {
      const googleCredential = response.credential;
      try {
        showToastLocal("Creating account...", "success");
        const res = await fetch("http://localhost:8000/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: googleCredential })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({detail:"Failed"}));
          throw new Error(err.detail || "Signup failed");
        }
        const data = await res.json();
        localStorage.setItem("spendly_token", data.access_token);
        localStorage.setItem("spendly_user", data.user.email);
        localStorage.setItem("spendly_name", data.user.name);
        localStorage.setItem("spendly_pfp", data.user.picture || "");
        localStorage.setItem("spendly_loggedIn", "true");

        const profileKey = `spendly_profile_${data.user.email}`;
        localStorage.setItem(profileKey, JSON.stringify({
          firstName: data.user.name.split(' ')[0],
          lastName: data.user.name.split(' ').slice(1).join(' '),
          fullName: data.user.name,
          email: data.user.email,
          avatar: data.user.picture
        }));

        showToastLocal(`Welcome ${data.user.name}! Account created`, "success");
        setTimeout(() => window.location.href = "spendly.html", 800);
      } catch (e) {
        showToastLocal(e.message, "error");
      }
    }

    function showToastLocal(message, type="success") {
      const toast = document.getElementById("toast");
      if (!toast) return alert(message);
      toast.className = `toast ${type}`;
      toast.innerText = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }
  </script>
</body>
</html>
