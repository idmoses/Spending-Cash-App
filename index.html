<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly - Sign Up</title>
  <link rel="stylesheet" href="spendlylogin.css">
  <!-- ADDED PER GUIDE -->
</head>

<body>
  <div id="toast" class="toast"></div>

  <!-- GOOGLE CONFIG - GUIDE SECTION 4 & 10 -->
  <div id="g_id_onload" data-client_id="580362013753-49letv4r4ffp5nupqiajur9g3f94tkpi.apps.googleusercontent.com"
    data-context="signup" data-callback="handleGoogleResponse" data-auto_prompt="false">
  </div>

  <div class="bg-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
  </div>

  <div class="login-container fade-in">
    <div class="login-left">
      <h1>💸 Spendly</h1>
      <h2>Start Your Journey</h2>
      <p>Join thousands managing their money smarter. Free forever.</p>
      <img src="https://img.freepik.com/free-vector/mobile-payments-concept-illustration_114360-1665.jpg" alt="Finance">
    </div>

    <div class="login-right">
      <div class="login-box slide-up">
        <h2>Create Account ✨</h2>
        <p class="subtitle">It's free and takes 30 seconds</p>

      <div id="googleBtnContainer" onclick="googleLogin()"></div>

        <div class="divider"><span>or</span></div>

        <form id="signupForm">
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="fullname" placeholder="John Doe" required>
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@email.com" required>
          </div>
          <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Min 6 characters" required>
              <span class="eye-icon" id="togglePassword">👁️</span>
            </div>
          </div>

          <button type="submit" class="btn-login">Create Account →</button>
          <p class="signup">Already have an account? <a href="login.html">Login</a></p>
        </form>
      </div>
    </div>
  </div>
  <!-- GOOGLE LOGIC - SAME AS LOGIN, WORKS FOR SIGNUP TOO PER GUIDE SEC 12 -->
  <script>
    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "580362013753-49letv4r4ffp5nupqiajur9g3f94tkpi.apps.googleusercontent.com",
        callback: handleGoogleResponse
      });
      google.accounts.id.renderButton(
        document.getElementById("googleBtnContainer"),
        { theme: "outline", size: "large", width: 280 }
      );
    };

    async function handleGoogleResponse(response) {
      const googleCredential = response.credential;
      try {
        showToastLocal("Creating account...", "success");
        const res = await fetch("https://expense-tracker-afoz.onrender.com/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: googleCredential })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "Failed" }));
          throw new Error(err.detail || "Signup failed");
        }
        const data = await res.json();
        localStorage.setItem("spendly_token", data.access_token);
        localStorage.setItem("spendly_user", data.user.email);
        localStorage.setItem("spendly_name", data.user.name);
        localStorage.setItem("spendly_pfp", data.user.picture || "");
        localStorage.setItem("spendly_loggedIn", "true");

        const profileKey = `spendly_profile_${data.user.email}`;
        localStorage.setItem(profileKey, JSON.stringify({
          firstName: data.user.name.split(' ')[0],
          lastName: data.user.name.split(' ').slice(1).join(' '),
          fullName: data.user.name,
          email: data.user.email,
          avatar: data.user.picture
        }));

        showToastLocal(`Welcome ${data.user.name}! Account created`, "success");
        setTimeout(() => window.location.href = "login.html", 800);
      } catch (e) {
        showToastLocal(e.message, "error");
      }
    }

    function showToastLocal(message, type = "success") {
      const toast = document.getElementById("toast");
      if (!toast) return alert(message);
      toast.className = `toast ${type}`;
      toast.innerText = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }
  </script>


<script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="spendlylogin.js"></script>
</body>

</html>
